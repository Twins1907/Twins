[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giftpulse"
version = "0.1.0"
description = "Non-custodial execution and alerts layer for the Telegram Gifts market."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
giftpulse = "giftpulse.main:cli"

[tool.setuptools.packages.find]
include = ["giftpulse*"]

[tool.setuptools.package-data]
giftpulse = ["miniapp/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() in argument defaults is FastAPI's documented dependency-injection
# idiom, not the mutable-default bug B008 exists to catch.
"giftpulse/api/app.py" = ["B008"]
